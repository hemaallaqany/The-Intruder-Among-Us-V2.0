<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>بيننا دخيل - النسخة المتقدمة</title>
<link class="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  :root {
    --bg: #0a0a12;
    --surface: #13131f;
    --surface2: #1c1c2e;
    --border: #2a2a40;
    --accent: #e63946;
    --accent2: #ff6b6b;
    --gold: #ffd166;
    --teal: #06d6a0;
    --purple: #7b2d8b;
    --text: #f0f0f8;
    --muted: #8888a8;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden; 
    position: fixed; 
  }

  body {
    font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 20%, rgba(230,57,70,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(6,214,160,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .app {
    width: 100%;
    max-width: 440px;
    height: 100%;
    max-height: 850px; 
    display: flex;
    flex-direction: column;
    padding: 16px;
    position: relative;
    z-index: 1;
  }
  .screen {
    display: none;
    width: 100%;
    height: 100%;
    animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .screen.active { 
    display: flex; 
    flex-direction: column;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to   { opacity: 1; transform: scale(1); }
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 20px;
    box-shadow: var(--shadow);
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden; 
  }

  .scrollable-content {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
    margin-bottom: 16px;
  }
  .scrollable-content::-webkit-scrollbar { width: 4px; }
  .scrollable-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── TYPOGRAPHY ── */
  .game-title {
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 6px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .game-subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 24px;
  }
  h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 16px; text-align: center; }
  h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 10px; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 16px;
    flex-shrink: 0;
  }
  .section-title span { font-size: 1.3rem; }

  /* ── BUTTONS ── */
  .btn {
    display: block;
    width: 100%;
    padding: 13px 20px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    text-align: center;
    flex-shrink: 0; 
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #c1121f);
    color: #fff;
    box-shadow: 0 4px 16px rgba(230,57,70,0.25);
  }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-teal {
    background: linear-gradient(135deg, var(--teal), #04b889);
    color: #000;
  }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold), #f4a700);
    color: #000;
  }
  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }
  .btn-sm {
    width: auto;
    display: inline-block;
    padding: 8px 14px;
    font-size: 0.85rem;
  }
  .btn-gap { margin-top: 10px; }
  .back-btn { align-self: flex-start; margin-bottom: 14px; padding: 6px 12px; font-size: 0.85rem; }

  /* ── INPUTS ── */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-shrink: 0;
  }
  input[type="text"], input[type="number"] {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, input[type="number"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  /* ── CUSTOM DROPDOWN ── */
  .custom-dropdown {
    position: relative;
    width: 100%;
    margin-bottom: 8px;
  }
  .dropdown-select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 14px;
    text-align: right;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: border-color 0.2s;
  }
  .dropdown-select:focus { border-color: var(--accent); }
  .dropdown-select::after {
    content: '▼';
    font-size: 0.75rem;
    color: var(--muted);
    transition: transform 0.2s;
  }
  .custom-dropdown.open .dropdown-select::after {
    transform: rotate(180deg);
    color: var(--accent);
  }
  
  .dropdown-options {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    z-index: 99999;
    max-height: 180px;
    overflow-y: auto;
    display: none;
    animation: dropdownFade 0.2s ease;
  }
  .custom-dropdown.open .dropdown-options {
    display: block;
  }
  .dropdown-option {
    padding: 12px 14px;
    font-size: 0.95rem;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
    text-align: right;
  }
  .dropdown-option:hover, .dropdown-option.selected {
    background: var(--surface2);
    color: var(--gold);
  }
  @keyframes dropdownFade {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── LISTS ── */
  .player-list { display: flex; flex-direction: column; gap: 8px; }
  .list-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.95rem;
  }
  .list-item-del {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 1.1rem; line-height: 1; padding: 2px 6px;
  }
  .list-item-del:hover { color: var(--accent); }

  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; flex-shrink: 0; }

  /* ── PASS SCREEN ── */
  .pass-name {
    font-size: 2rem;
    font-weight: 900;
    color: var(--gold);
    margin: 14px 0 24px;
    text-align: center;
    word-break: break-word;
  }
  .pass-label { color: var(--muted); text-align: center; font-size: 1rem; }

  /* ── TIMER ── */
  .game-timer {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent2);
    text-align: center;
    margin-bottom: 10px;
    background: rgba(230,57,70,0.1);
    padding: 6px;
    border-radius: var(--radius-sm);
  }

  /* ── QUESTION REVEAL ── */
  .question-box {
    background: var(--surface2);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 24px 16px;
    text-align: center;
    margin: 16px 0;
    cursor: pointer;
    position: relative;
    min-height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .question-box.hidden-q { border-color: var(--accent); }
  .question-box .blur-text {
    font-size: 1.15rem;
    font-weight: 700;
    filter: blur(12px);
    transition: filter 0.3s ease;
    color: var(--text);
    line-height: 1.6;
    word-break: break-word;
  }
  .question-box.revealed .blur-text { filter: none; }
  .tap-hint {
    position: absolute;
    bottom: 10px;
    left: 50%; transform: translateX(-50%);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .question-box.revealed .tap-hint { display: none; }

  .room-banner {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    font-size: 0.85rem;
    margin-bottom: 14px;
    line-height: 1.5;
    flex-shrink: 0;
  }

  /* ── MODAL SYSTEM ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,5,10,0.85);
    backdrop-filter: blur(6px);
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: var(--shadow);
    text-align: center;
    animation: modalSlideUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes modalSlideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-icon { font-size: 2.2rem; margin-bottom: 12px; }
  .modal-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 18px; color: var(--text); }
  .modal-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 12px 14px;
    outline: none;
    text-align: right;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-buttons { display: flex; gap: 10px; justify-content: center; }

  /* ── ALERTS ── */
  #custom-alert {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%) translateY(-40px);
    background: rgba(19,19,31,0.95);
    border: 1px solid var(--border);
    padding: 12px 20px;
    border-radius: 40px;
    box-shadow: var(--shadow);
    z-index: 999999;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
  }
  #custom-alert.active { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ── CHAT & MESSAGES ── */
  .chat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    height: 150px;
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .msg {
    font-size: 0.85rem;
    line-height: 1.4;
    background: rgba(255,255,255,0.03);
    padding: 6px 10px;
    border-radius: 8px;
    word-break: break-word;
    position: relative;
    cursor: pointer;
  }
  .msg:hover { background: rgba(255,255,255,0.06); }
  .msg-system { background: rgba(255,210,102,0.08); color: var(--gold); border-right: 3px solid var(--gold); }
  .msg-me { background: rgba(6,214,160,0.08); border-right: 3px solid var(--teal); }
  .msg-reply { background: rgba(123,45,139,0.15); border-right: 3px solid var(--purple); }

  /* ── TREE LIBRARY DESIGN ── */
  .tree-category {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .tree-cat-header {
    background: rgba(255,255,255,0.02);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
  }
  .tree-children {
    margin-right: 14px;
    padding-top: 6px;
    border-right: 2px dashed var(--border);
    padding-right: 10px;
  }
  .badge-btn {
    padding: 4px 10px;
    font-size: 0.8rem;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: white;
    cursor: pointer;
    margin-right: 5px;
    font-family: inherit;
  }
  .badge-add { background: var(--teal); color: #000; font-weight: 700; }
  .empty-state { color: var(--muted); text-align: center; padding: 20px 0; font-size: 0.9rem; }
</style>
</head>
<body>

<div id="custom-alert">
  <span id="alert-icon">🔔</span>
  <span id="alert-text">...</span>
</div>

<div class="modal-overlay" id="custom-prompt-modal">
  <div class="modal-box">
    <div class="modal-icon" id="custom-prompt-icon">📝</div>
    <div class="modal-text" id="custom-prompt-title">إدخال بيانات جديدة</div>
    <input type="text" class="modal-input" id="custom-prompt-input" placeholder="...">
    <div class="modal-buttons">
      <button class="btn btn-primary btn-sm" id="custom-prompt-save" style="min-width: 80px;">حفظ</button>
      <button class="btn btn-secondary btn-sm" id="custom-prompt-cancel" style="min-width: 80px;">إلغاء</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-icon" id="modal-icon">🛑</div>
    <div class="modal-text" id="modal-text">هل أنت متأكد؟</div>
    <div class="modal-buttons">
      <button class="btn btn-primary btn-sm" id="modal-yes-btn">نعم</button>
      <button class="btn btn-secondary btn-sm" id="modal-no-btn">تراجع</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="screen active" id="screen-menu">
    <div class="card" style="justify-content: center; text-align: center;">
      <div class="game-title">بيننا دخيل</div>
      <div class="game-subtitle">النسخة المتقدمة • الإصدار الذكي 🎭</div>
      <div class="input-row">
        <input type="text" id="main-player-name" placeholder="اكتب اسمك المستعار هنا...">
      </div>
      <button class="btn btn-primary btn-gap" onclick="goToLobbySetup('offline')">🎮 للعب أوفلاين (جهاز واحد)</button>
      <button class="btn btn-teal btn-gap" onclick="goToLobbySetup('online-host')">🏠 إنشاء غرفة أونلاين</button>
      <div class="divider"></div>
      <div class="input-row" style="margin-bottom: 8px;">
        <input type="text" id="join-room-code" placeholder="كود الغرفة المكون من 4 رموز...">
      </div>
      <button class="btn btn-secondary" onclick="joinOnlineRoom()">🔑 انضمام لغرفة قائمة</button>
      <div class="divider"></div>
      <button class="btn btn-gold" onclick="showScreen('screen-library')">📚 إدارة مكتبة الأسئلة والفئات</button>
    </div>
  </div>

  <div class="screen" id="screen-library">
    <div class="card" style="display: flex; flex-direction: column; height: 100%; overflow: hidden;">
      <button class="btn btn-secondary back-btn" onclick="showScreen('screen-menu')">⬅️ عودة للقائمة</button>
      <h2 style="flex-shrink: 0; margin-bottom: 12px;">إدارة الفئات والمجموعات</h2>
      
      <div class="scrollable-content" id="lib-list" style="flex: 1; overflow-y: auto; margin-bottom: 12px;"></div>
      
      <div style="flex-shrink: 0; background: var(--surface); padding-top: 8px; border-top: 1px solid var(--border);">
        <div class="card" style="padding: 12px; margin-bottom: 8px; background: var(--surface2); height: auto; box-shadow: none;">
          <h3 style="font-size: 0.85rem; color: var(--gold); margin-bottom: 6px;">➕ إنشاء فئة جديدة كلياً:</h3>
          <div class="input-row" style="margin-bottom: 0;">
            <input type="text" id="new-category-input" placeholder="اسم الفئة الفنية الكبرى...">
            <button class="btn btn-primary" style="width: auto; padding: 10px 14px;" onclick="addCategory()">حفظ</button>
          </div>
        </div>
        
        <div style="display: flex; gap: 8px; margin-bottom: 4px;">
          <button class="btn btn-secondary btn-sm" style="flex: 1; padding: 11px;" onclick="exportLibrary()">📥 تصدير JSON</button>
          <button class="btn btn-secondary btn-sm" style="flex: 1; padding: 11px; position: relative;">
            📤 استيراد JSON
            <input type="file" accept=".json" onchange="importLibrary(event)" style="position: absolute; inset: 0; opacity: 0; cursor: pointer;">
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// الحالة والبيانات الافتراضية
let state = {
  myPlayerName: "",
  gameMode: "offline",
  roomCode: "",
  players: [],
  scores: {},
  library: [
    {
      category: "📂 مأكولات ومشروبات",
      subcategories: [
        { name: "شاورما 🌯", questions: ["شاورما دجاج", "شاورما لحم"] },
        { name: "إفطار 🍳", questions: ["فول مدمس", "فلافل سخنة"] }
      ]
    },
    {
      category: "📂 تكنولوجيا وعاب",
      subcategories: [
        { name: "ألعاب الفيديو 🎮", questions: ["ببجي موبايل", "كول اوف ديوتي"] }
      ]
    }
  ]
};

// تهيئة وإدارة الـ Custom Input Modal بدلاً من الـ prompt الافتراضية
let activePromptCallback = null;

function showCustomPrompt(title, placeholder, icon, callback) {
  document.getElementById('custom-prompt-title').textContent = title;
  const inputEl = document.getElementById('custom-prompt-input');
  inputEl.value = "";
  inputEl.placeholder = placeholder;
  document.getElementById('custom-prompt-icon').textContent = icon;
  
  document.getElementById('custom-prompt-modal').classList.add('active');
  inputEl.focus();
  
  activePromptCallback = callback;
}

document.getElementById('custom-prompt-save').addEventListener('click', () => {
  const val = document.getElementById('custom-prompt-input').value.trim();
  document.getElementById('custom-prompt-modal').classList.remove('active');
  if (activePromptCallback) {
    activePromptCallback(val);
    activePromptCallback = null;
  }
});

document.getElementById('custom-prompt-cancel').addEventListener('click', () => {
  document.getElementById('custom-prompt-modal').classList.remove('active');
  activePromptCallback = null;
});

// التنقل بين الشاشات
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(id);
  if(target) target.classList.add('active');
  if (id === 'screen-library') renderLibrary();
}

// تنبيهات اللعبة المخصصة
function customAlert(txt, icon = '🔔') {
  document.getElementById('alert-icon').textContent = icon;
  document.getElementById('alert-text').textContent = txt;
  const alertEl = document.getElementById('custom-alert');
  alertEl.classList.add('active');
  setTimeout(() => alertEl.classList.remove('active'), 2500);
}

// إدارة وقراءة كاش الذاكرة المحلية للمكتبة
function loadLibrary() {
  const saved = localStorage.getItem('imposter_tree_lib');
  if(saved) {
    try { state.library = JSON.parse(saved); } catch(e) {}
  }
}
function saveLibrary() {
  localStorage.setItem('imposter_tree_lib', JSON.stringify(state.library));
}

// عرض شجرة الفئات والمجموعات
function renderLibrary() {
  const container = document.getElementById('lib-list');
  if(!container) return;
  
  if(!state.library || state.library.length === 0) {
    container.innerHTML = `<div class="empty-state">المكتبة فارغة حالياً! أضف فئة جديدة بالأسفل.</div>`;
    return;
  }
  
  container.innerHTML = state.library.map((catObj, cIdx) => {
    let subHtml = "";
    if(catObj.subcategories && catObj.subcategories.length > 0) {
      subHtml = catObj.subcategories.map((sub, sIdx) => {
        let qHtml = "";
        if(sub.questions && sub.questions.length > 0) {
          qHtml = sub.questions.map((q, qIdx) => `
            <div style="font-size:0.85rem; padding:4px 8px; background:rgba(255,255,255,0.02); margin-top:3px; border-radius:4px; display:flex; justify-content:between; align-items:center;">
              <span style="color:var(--text); font-weight:normal;">🔹 ${q}</span>
              <button class="list-item-del" style="font-size:0.8rem;" onclick="deleteQuestion(${cIdx}, ${sIdx}, ${qIdx})">🗑️</button>
            </div>
          `).join('');
        } else {
          qHtml = `<div class="empty-state" style="padding:4px 0; font-size:0.75rem;">لا توجد كلمات/أسئلة هنا.</div>`;
        }
        
        return `
          <div style="background:rgba(255,255,255,0.03); padding:8px; border-radius:6px; margin-bottom:8px;">
            <div style="display:flex; justify-content:between; align-items:center; margin-bottom:4px;">
              <strong style="color:var(--gold); font-size:0.9rem;">📦 ${sub.name}</strong>
              <div>
                <button class="badge-btn badge-add" onclick="promptAddQuestion(${cIdx}, ${sIdx})">➕ كلمة</button>
                <button class="list-item-del" onclick="deleteSubcategory(${cIdx}, ${sIdx})">🗑️</button>
              </div>
            </div>
            <div style="padding-right:10px; border-right:1px dotted var(--border);">
              ${qHtml}
            </div>
          </div>
        `;
      }).join('');
    } else {
      subHtml = `<div class="empty-state" style="font-size:0.8rem;">لا توجد مجموعات داخل هذه الفئة.</div>`;
    }
    
    return `
      <div class="tree-category">
        <div class="tree-cat-header">
          <span>${catObj.category}</span>
          <div>
            <button class="badge-btn badge-add" onclick="promptAddSubcategory(${cIdx})">➕ مجموعة</button>
            <button class="list-item-del" style="color:var(--accent);" onclick="deleteCategoryFromTree(${cIdx})">🗑️ فئة</button>
          </div>
        </div>
        <div class="tree-children" style="padding:10px;">
          ${subHtml}
        </div>
      </div>
    `;
  }).join('');
}

// العمليات على الفئات والمجموعات باستخدام نظام الـ Input Modal الحديث
function addCategory() {
  const input = document.getElementById('new-category-input');
  const val = input.value.trim();
  if(!val) { customAlert('يرجى كتابة اسم الفئة أولاً!', '⚠️'); return; }
  state.library.push({ category: "📂 " + val, subcategories: [] });
  input.value = "";
  saveLibrary(); renderLibrary();
  customAlert('تم إضافة الفئة الكبرى بنجاح!', '✅');
}

function promptAddSubcategory(cIdx) {
  showCustomPrompt('إنشاء مجموعة داخل الفئة', 'اسم المجموعة (مثال: سيارات رياضية 🏎️)...', '📦', (name) => {
    if(!name) return;
    state.library[cIdx].subcategories.push({ name: name, questions: [] });
    saveLibrary(); renderLibrary();
    customAlert('تم إضافة المجموعة بنجاح!', '✅');
  });
}

function promptAddQuestion(cIdx, sIdx) {
  showCustomPrompt('إضافة كلمة سرية جديدة', 'اكتب الكلمة أو السؤال...', '🔹', (q) => {
    if(!q) return;
    state.library[cIdx].subcategories[sIdx].questions.push(q);
    saveLibrary(); renderLibrary();
    customAlert('تم حفظ الكلمة السرية بنجاح!', '✅');
  });
}

// الحذف والمعالجة
function deleteCategoryFromTree(cIdx) {
  state.library.splice(cIdx, 1);
  saveLibrary(); renderLibrary();
}

function deleteSubcategory(cIdx, sIdx) {
  state.library[cIdx].subcategories.splice(sIdx, 1);
  saveLibrary(); renderLibrary();
}

function deleteQuestion(cIdx, sIdx, qIdx) {
  state.library[cIdx].subcategories[sIdx].questions.splice(qIdx, 1);
  saveLibrary(); renderLibrary();
}

// تصدير واستيراد
function exportLibrary() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.library, null, 2));
  const dl = document.createElement('a');
  dl.setAttribute("href", dataStr); dl.setAttribute("download", "imposter_tree_library.json");
  document.body.appendChild(dl); dl.click(); dl.remove();
}

function importLibrary(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (Array.isArray(parsed)) {
        state.library = parsed; saveLibrary(); renderLibrary();
        customAlert('تم استيراد قائمة الفئات والمجموعات بنجاح!', '✅');
      }
    } catch (err) { customAlert('الملف غير صالح أو تالف!', '❌'); }
  };
  reader.readAsText(file);
}

// المساعدات الشاملة (Shuffler)
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.addEventListener('load', () => {
  loadLibrary();
});
</script>
